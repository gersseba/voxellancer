[general]
# activate if you have only 1fps...
hd3000workaround = true
# world units to meter translation for oculusrift
unitInMetres = 0.2
showIntro=true

# point to aim at if no enemy is under the crosshair
infinityAimDistance = 512
# the lower this value, the longer it takes to aim at infinity again
infinityAimInterpolation = 0.3 

# Temporary player protection; toggle and save in Settings.
playerShipUndestroyable = true
cameraOffset = 0.0, 0.6, 1.5

[contracts]
damageRewardBonus=0.15
shieldRewardBonus=0.20
# Enemies hold position until a player is within this multiple of the base weapon's range.
baseWeapon=pulselaser
engageRangeFactor=1.5

[aiShooting]
lead=0.5
tracking=0.5
accuracy=0.5

# Each level lists the cover layouts that suit it; one is chosen at random per
# sortie. Layouts: none, asteroidfield, asteroidline, debriscluster, debrischunk.
# formation selects the enemy spawn pattern (1-3).
[contractlevel1]
name=RAIDER PATROL
objective=Destroy the raider patrol.
description=Intercept a light patrol in open space.
enemy=contractraider
reward=100
enemiesPerPlayer=1
formation=1
layouts=none,asteroidfield,asteroidline

[contractlevel2]
name=DEBRIS CROSSFIRE
objective=Destroy the autocannon gunships hiding in the wreck field.
description=Break an autocannon ambush among derelict barriers.
enemy=contractgunner
reward=150
enemiesPerPlayer=2
formation=2
layouts=debriscluster,debrischunk

[contractlevel3]
name=FORTIFIED BLOCKADE
objective=Break through the shielded blockade.
description=Defeat shielded plasma defenders around a fortified lane.
enemy=contractbulwark
reward=200
enemiesPerPlayer=1
formation=3
layouts=asteroidline,debrischunk

[contractlevel4]
name=THE IRON REGENT
objective=Destroy the shield projector, then the Iron Regent.
description=Break the shield projector and silence the flagship guns.
enemy=contractflagship
reward=300
enemiesPerPlayer=1
formation=3
layouts=asteroidline,asteroidfield,debrischunk

[contractsignal1]
name=DERELICT CACHE
objective=Recover the derelict salvage.
description=Recover salvage without a fight.
enemy=contractraider
reward=50
enemiesPerPlayer=0
formation=1
layouts=debrischunk,debriscluster

[contractsignal2]
name=DISTRESS CALL
objective=Destroy the raiders before they kill the wingman.
description=Drive off the raiders and protect the stranded wingman.
enemy=contractraider
reward=125
rescueBonus=75
enemiesPerPlayer=1
formation=2
layouts=debriscluster,debrischunk,asteroidfield

[contractsignal3]
name=DECOY BEACON
objective=Survive the ambush and destroy the bulwark.
description=A false beacon draws you into a shielded ambush.
enemy=contractbulwark
reward=225
enemiesPerPlayer=1
formation=2
layouts=asteroidfield,debriscluster

[window]
width = 1280
height = 800
vsync = true

[hud]
arrowDistance = 0.5

[vr]
eyeZOffset = -0.05

[input]
# area around the middle in which the mouse has no rotating effect
deadzoneMouse = 0.0
# gamepad's sensitivity, increase if ship moves without actual input on gamepad
deadzoneGamepad = 0.2
# time in second it take to recognise a press of a mouse button as a click, rather than a long press
maxClickTime = 0.25

flycamMoveFactor = 1.0
flycamRotateFactor = 0.1
flycamMouseMultiplier = 10.0

[physics]
globalDirectionalDampening = 2.5
globalAngularDampening = 2.8
rotationFactor = 0.1
elasticity = 0.3

debrisDirectionalDampening = 0.0
debrisAngularDampening = 0.0
debrisBaseForce = 10.0
debrisAngularBaseForce = 5.0

explosionDirectionalDampening = 0.1
explosionAngularDampening = 0.2
explosionBaseForce = 8.0
explosionAngularBaseForce = 20.0

[particle]
checkinterval = 1.0
multithreaded = false

[vfx]
lightdir = 0.3, 0.5, 1.0

engineTrailStepDistance = 1
engineTrailIdleCooldown = 0.5

debrisLifetime = 15

drawhud = true

# choose either ssaa, fxaa or none
antialiasing = ssaa

[starfield]
size = 0.2 # size of a star
time = 0.025 # defines the size of the stripes
count = 200 # number of stars
radius = 150 # size of the field around the player

