<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voxellancer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #070e17; color: #e4f7ff; font-family: sans-serif; }
    main { height: 100%; display: grid; place-items: center; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    #status { position: absolute; top: 1rem; left: 1rem; padding: .6rem; background: #102334; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <main><canvas id="canvas" tabindex="0" aria-label="Voxellancer game"></canvas></main>
  <div id="status" role="status">Loading Voxellancer...</div>
  <script>
    var statusElement = document.getElementById("status");
    var Module = {
      canvas: document.getElementById("canvas"),
      showNotice: text => { statusElement.textContent = text; },
      setStatus: text => { statusElement.textContent = text; },
      onAbort: reason => { statusElement.textContent = "Could not start Voxellancer: " + reason; }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
